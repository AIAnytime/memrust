name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf memrust-${{ github.ref_name }}-${{ matrix.target }}.tar.gz memrust
      - uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/memrust-*.tar.gz

  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Requires the CARGO_REGISTRY_TOKEN repository secret.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    # Uses PyPI trusted publishing (configure the project on pypi.org first).
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build sdks/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

  npm:
    name: Publish TypeScript SDK to npm
    runs-on: ubuntu-latest
    # Requires the NPM_TOKEN repository secret.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - working-directory: sdks/typescript
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
