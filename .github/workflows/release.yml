name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf memrust-${{ github.ref_name }}-${{ matrix.target }}.tar.gz memrust
      - uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/memrust-*.tar.gz

  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Skips cleanly until the CARGO_REGISTRY_TOKEN repository secret exists.
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Skip (no CARGO_REGISTRY_TOKEN secret)
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo "CARGO_REGISTRY_TOKEN not configured — skipping crates.io publish"
      - uses: actions/checkout@v4
        if: env.CARGO_REGISTRY_TOKEN != ''
      - uses: dtolnay/rust-toolchain@stable
        if: env.CARGO_REGISTRY_TOKEN != ''
      - if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"

  pypi:
    name: Publish Python SDK to PyPI
    runs-on: ubuntu-latest
    # Token auth via the PYPI_TOKEN repository secret.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build sdks/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          password: ${{ secrets.PYPI_TOKEN }}

  npm:
    name: Publish TypeScript SDK to npm
    runs-on: ubuntu-latest
    # Skips cleanly until the NPM_TOKEN repository secret exists.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Skip (no NPM_TOKEN secret)
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN not configured — skipping npm publish"
      - uses: actions/checkout@v4
        if: env.NODE_AUTH_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NODE_AUTH_TOKEN != ''
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - if: env.NODE_AUTH_TOKEN != ''
        working-directory: sdks/typescript
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm publish --access public
